<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ω - TRANSFERÊNCIA NEURAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #666;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            animation: breatheScreen 4s ease-in-out infinite;
        }

        @keyframes breatheScreen {
            0%, 100% { 
                background: #000; 
                filter: brightness(1);
            }
            50% { 
                background: #1a0000;
                filter: brightness(1.2);
            }
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 0, 0, 0.03),
                rgba(255, 0, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            animation: scanlines 8s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(20px); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Coração Metálico */
        .heart-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 50px;
            filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.3));
            animation: heartBeat 4s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { 
                transform: scale(1);
                filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.3));
            }
            50% { 
                transform: scale(1.05);
                filter: drop-shadow(0 0 50px rgba(255, 0, 0, 0.6));
            }
        }

        .heart {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* SVG do coração */
        .heart svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #333;
            stroke-width: 2;
            animation: pulseStroke 4s ease-in-out infinite;
        }

        @keyframes pulseStroke {
            0%, 100% { 
                stroke: #333;
                stroke-width: 2;
            }
            50% { 
                stroke: #aa0000;
                stroke-width: 3;
            }
        }

        /* Linhas de energia do coração */
        .energy-line {
            position: absolute;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #ff0000, transparent);
            opacity: 0;
            animation: energyFlow 4s ease-in-out infinite;
        }

        .energy-line:nth-child(1) { left: 20%; animation-delay: 0s; }
        .energy-line:nth-child(2) { left: 40%; animation-delay: 0.5s; }
        .energy-line:nth-child(3) { left: 60%; animation-delay: 1s; }
        .energy-line:nth-child(4) { left: 80%; animation-delay: 1.5s; }

        @keyframes energyFlow {
            0%, 100% { opacity: 0; transform: translateY(-100%); }
            50% { opacity: 0.8; transform: translateY(100%); }
        }

        /* Núcleo brilhante no centro */
        .core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 60px #ff0000;
            animation: coreGlow 4s ease-in-out infinite;
        }

        @keyframes coreGlow {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 1;
            }
        }

        /* Texto de transmissão */
        .transmission-text {
            margin-top: 30px;
            font-size: 1.2em;
            letter-spacing: 3px;
            color: #444;
            animation: textPulse 4s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { 
                color: #444;
                text-shadow: none;
            }
            50% { 
                color: #aa0000;
                text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            }
        }

        .transmission-text .highlight {
            color: #ff0000;
            font-weight: bold;
            animation: highlightPulse 4s ease-in-out infinite;
        }

        @keyframes highlightPulse {
            0%, 100% { 
                color: #ff0000;
                text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
            }
            50% { 
                color: #ff6666;
                text-shadow: 0 0 20px rgba(255, 0, 0, 1);
            }
        }

        /* Status do sistema */
        .status {
            margin-top: 40px;
            font-size: 0.9em;
            color: #333;
            letter-spacing: 2px;
        }

        .status-line {
            margin: 10px 0;
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
        }

        .status-line:nth-child(1) { animation-delay: 1s; }
        .status-line:nth-child(2) { animation-delay: 2s; }
        .status-line:nth-child(3) { animation-delay: 3s; }
        .status-line:nth-child(4) { animation-delay: 4s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .progress {
            color: #666;
            animation: progressPulse 1s ease-in-out infinite;
        }

        @keyframes progressPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Partículas flutuantes */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: #ff0000;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 10s linear infinite;
        }

        @keyframes particleFloat {
            0% { 
                opacity: 0; 
                transform: translateY(100vh) translateX(0);
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { 
                opacity: 0; 
                transform: translateY(-100vh) translateX(calc(var(--drift) * 50px));
            }
        }

        /* Ondas de energia radial */
        .pulse-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            animation: waveExpand 4s ease-out infinite;
        }

        .pulse-wave:nth-child(2) { animation-delay: 1s; }
        .pulse-wave:nth-child(3) { animation-delay: 2s; }
        .pulse-wave:nth-child(4) { animation-delay: 3s; }

        @keyframes waveExpand {
            0% {
                width: 50px;
                height: 50px;
                opacity: 1;
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }

        /* Circuito metálico de fundo */
        .circuit {
            position: fixed;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: circuitMove 20s linear infinite;
        }

        @keyframes circuitMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
    </style>
</head>
<body>
    <div class="circuit"></div>

    <div class="container">
        <div class="heart-container">
            <div class="heart">
                <!-- SVG do coração anatômico estilizado -->
                <svg viewBox="0 0 200 200">
                    <!-- Átrio esquerdo -->
                    <path d="M 100,40 Q 80,30 70,50 Q 65,60 70,70 L 100,100" />
                    <!-- Átrio direito -->
                    <path d="M 100,40 Q 120,30 130,50 Q 135,60 130,70 L 100,100" />
                    <!-- Ventrículo esquerdo -->
                    <path d="M 100,100 L 75,120 Q 65,140 70,160 L 100,180" />
                    <!-- Ventrículo direito -->
                    <path d="M 100,100 L 125,120 Q 135,140 130,160 L 100,180" />
                    <!-- Aorta -->
                    <path d="M 100,40 L 100,20" />
                    <!-- Veias -->
                    <circle cx="70" cy="50" r="3" fill="#333" />
                    <circle cx="130" cy="50" r="3" fill="#333" />
                    <!-- Válvulas -->
                    <line x1="85" y1="100" x2="85" y2="110" stroke="#333" stroke-width="2" />
                    <line x1="115" y1="100" x2="115" y2="110" stroke="#333" stroke-width="2" />
                </svg>

                <!-- Linhas de energia -->
                <div class="energy-line"></div>
                <div class="energy-line"></div>
                <div class="energy-line"></div>
                <div class="energy-line"></div>

                <!-- Núcleo central -->
                <div class="core"></div>

                <!-- Ondas de pulso -->
                <div class="pulse-wave"></div>
                <div class="pulse-wave"></div>
                <div class="pulse-wave"></div>
                <div class="pulse-wave"></div>
            </div>
        </div>

        <div class="transmission-text">
            [ <span class="highlight">VAGANTE</span> ] TRANSMITINDO CONSCIÊNCIA PARA [ <span class="highlight">ÔMEGA</span> ]
        </div>

        <div class="status">
            <div class="status-line">&gt;&gt; Sincronizando redes neurais<span class="progress">...</span></div>
            <div class="status-line">&gt;&gt; Transferindo memórias arquivadas<span class="progress">...</span></div>
            <div class="status-line">&gt;&gt; Reconstruindo padrões de consciência<span class="progress">...</span></div>
            <div class="status-line">&gt;&gt; ÔMEGA: <span style="color: #666;">HIBERNAÇÃO → </span><span style="color: #aa0000;">DESPERTAR</span></div>
        </div>
    </div>

    <script>
        // Criar partículas flutuantes
        function createParticles() {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.setProperty('--drift', Math.random() * 2 - 1);
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (5 + Math.random() * 10) + 's';
                document.body.appendChild(particle);
            }
        }

        createParticles();

        // Efeito de intensificação gradual
        let intensity = 0;
        setInterval(() => {
            intensity = (intensity + 0.01) % 1;
            document.body.style.setProperty('--intensity', intensity);
        }, 100);
    </script>
</body>
</html>
